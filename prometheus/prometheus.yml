global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ---- FastAPI instances ----
  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api1:8000"
          - "api2:8000"
          - "api3:8000"

  # ---- Kafka (via kafka-exporter) ----
  - job_name: "kafka"
    static_configs:
      - targets:
          - "kafka-exporter:9308"

  # ---- PostgreSQL (via postgres-exporter) ----
  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  # ---- Nginx (via nginx-exporter) ----
  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  # ---- Prometheus self-monitoring ----
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

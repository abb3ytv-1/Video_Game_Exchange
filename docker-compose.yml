services:

  # ---- Shard 0: stores records with even IDs (2, 4, 6 ...) ----
  postgres_shard0:
    image: postgres:16
    container_name: postgres-shard0
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: passgame
      POSTGRES_DB: videogameexchange
    volumes:
      - postgres_shard0_data:/var/lib/postgresql/data
      - ./init/init_shard0.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d videogameexchange"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - api-network

  # ---- Shard 1: stores records with odd IDs (1, 3, 5 ...) ----
  postgres_shard1:
    image: postgres:16
    container_name: postgres-shard1
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: passgame
      POSTGRES_DB: videogameexchange
    volumes:
      - postgres_shard1_data:/var/lib/postgresql/data
      - ./init/init_shard1.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d videogameexchange"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - api-network

  api1:
    build: .
    container_name: api1
    environment:
      SHARD0_URL: postgresql://gameuser:passgame@postgres_shard0:5432/videogameexchange
      SHARD1_URL: postgresql://gameuser:passgame@postgres_shard1:5432/videogameexchange
      CONTAINER_NAME: api1
    depends_on:
      postgres_shard0:
        condition: service_healthy
      postgres_shard1:
        condition: service_healthy
    networks:
      - api-network

  api2:
    build: .
    container_name: api2
    environment:
      SHARD0_URL: postgresql://gameuser:passgame@postgres_shard0:5432/videogameexchange
      SHARD1_URL: postgresql://gameuser:passgame@postgres_shard1:5432/videogameexchange
      CONTAINER_NAME: api2
    depends_on:
      postgres_shard0:
        condition: service_healthy
      postgres_shard1:
        condition: service_healthy
    networks:
      - api-network

  api3:
    build: .
    container_name: api3
    environment:
      SHARD0_URL: postgresql://gameuser:passgame@postgres_shard0:5432/videogameexchange
      SHARD1_URL: postgresql://gameuser:passgame@postgres_shard1:5432/videogameexchange
      CONTAINER_NAME: api3
    depends_on:
      postgres_shard0:
        condition: service_healthy
      postgres_shard1:
        condition: service_healthy
    networks:
      - api-network

  nginx:
    image: nginx:latest
    container_name: nginx-load-balancer
    ports:
      - "8080:80"  # expose port 80 inside container as 8080 on host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - api-network
  
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - api-network

  email_consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: email_consumer
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - SMTP_HOST=smtp.ethereal.email
      - SMTP_PORT=587
      - SMTP_USER=${ETHEREAL_USER:-}
      - SMTP_PASS=${ETHEREAL_PASS:-}
      - SMTP_FROM=${ETHEREAL_USER:-}
    networks:
      - api-network
  
  prometheus:
    build: ./prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api1
      - api2
      - api3
      - postgres-exporter-shard0
      - postgres-exporter-shard1
    networks:
      - api-network
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - api-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      - kafka
    networks:
      - api-network
  
  postgres-exporter-shard0:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-shard0
    environment:
      DATA_SOURCE_NAME: "postgresql://gameuser:passgame@postgres_shard0:5432/videogameexchange?sslmode=disable"
    depends_on:
      postgres_shard0:
        condition: service_healthy
    networks:
      - api-network

  postgres-exporter-shard1:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-shard1
    environment:
      DATA_SOURCE_NAME: "postgresql://gameuser:passgame@postgres_shard1:5432/videogameexchange?sslmode=disable"
    depends_on:
      postgres_shard1:
        condition: service_healthy
    networks:
      - api-network
  
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx-load-balancer:80/stub_status"
    depends_on:
      - nginx
    networks:
      - api-network

volumes:
  postgres_shard0_data:
  postgres_shard1_data:
  grafana_data:

networks:
  api-network:
    driver: bridge
